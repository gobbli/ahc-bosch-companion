name: Import test against Home Assistant Core 2026.10

on:
  push:
    branches:
      - "feature/**"
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homeassistant-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install current Home Assistant Core
        run: python -m pip install "homeassistant==2026.10.1" "paho-mqtt>=2,<3"
      - name: Import every integration module
        run: |
          python - <<'PY'
          import importlib
          import homeassistant
          for mod in (
              "custom_components.ahc_bosch_companion",
              "custom_components.ahc_bosch_companion.config_flow",
              "custom_components.ahc_bosch_companion.controller",
              "custom_components.ahc_bosch_companion.climate",
              "custom_components.ahc_bosch_companion.sensor",
              "custom_components.ahc_bosch_companion.switch",
          ):
              module = importlib.import_module(mod)
              print("Imported:", module.__name__)
          PY
